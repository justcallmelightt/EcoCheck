name: EcoCheck checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  java-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-test-only
          MYSQL_DATABASE: ecocheck_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Initialize isolated test database tables
        run: |
          sed -e '/^CREATE DATABASE /d' -e '/^USE /d' backend/sql/schema.sql |
            docker exec -i -e MYSQL_PWD=integration-test-only ${{ job.services.mysql.id }} \
              mysql --default-character-set=utf8mb4 -uroot ecocheck_test
      - name: Java API and real MySQL tests
        working-directory: backend
        env:
          ECOCHECK_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/ecocheck_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED
          ECOCHECK_TEST_DB_USER: root
          ECOCHECK_TEST_DB_PASSWORD: integration-test-only
        run: sh mvnw --batch-mode --no-transfer-progress verify
  ios-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build Debug for iOS Simulator
        run: xcodebuild -project iOS/EcoCheck.xcodeproj -target EcoCheck -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - name: Build Release for iOS Simulator
        run: xcodebuild -project iOS/EcoCheck.xcodeproj -target EcoCheck -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
